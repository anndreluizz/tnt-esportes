# O plano grátis do Supabase pausa o projeto depois de uns 7 dias sem uso.
# A cada 3 dias esta rotina faz uma consulta pública ao banco, para ele continuar ativo.
# Obs.: o GitHub desliga rotinas agendadas se o repositório ficar 60 dias sem nenhum envio;
# nesse caso, é só abrir a aba Actions e reativar.
name: Manter o banco ativo
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta pública ao banco
        run: |
          KEY=sb_publishable_3iSg39IiqxfKxET5Us1MxA_vThWtmEu   # chave pública (a mesma de js/config.js)
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://alebsgxaswcjifwkwebe.supabase.co/rest/v1/campeonatos?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Resposta do banco: $code"
          test "$code" = "200"
