# Roda os testes a cada envio e a cada pull request. Não toca no Supabase de produção:
# o banco dos testes é um Postgres local (PGlite) criado na hora.
name: Testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Telas e regras (checar.js)
        run: node checar.js
      - name: Telas do campeonato escolar (checar-escola.js)
        run: node checar-escola.js
      - name: Leitor da lista do portal (gera-candidatos)
        run: node supabase/testar-candidatos.mjs
      - name: Banco, privacidade e políticas de armazenamento (supabase/testar.mjs)
        working-directory: supabase
        run: |
          npm ci
          npm test
      - name: Auditoria de alterações (supabase/testar-auditoria.mjs)
        working-directory: supabase
        run: npm run test:auditoria
      - name: Volume local, 16 equipes, 300 atletas, 120 jogos e mais de 1.200 eventos (supabase/testar-volume*.mjs)
        working-directory: supabase
        env:
          LIMITE_ESTRITO: 1   # o app não pode perder registros nem errar resultados com o limite de 1.000 linhas do Supabase
        run: npm run test:volume
