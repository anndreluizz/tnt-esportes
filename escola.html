<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>II Jogos Escolares Internos · TNT Esportes</title>
<meta name="description" content="Campeonato interno da escola: turmas, times, jogos e campeões">
<meta name="theme-color" content="#0d2f73">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  .esc{max-width:960px;margin:18px auto 40px;display:grid;gap:16px}
  .esc .f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
  .esc .f .span2{grid-column:1/-1}
  .esc textarea{min-height:110px}
  .esc h4{margin:14px 0 6px;padding-left:9px;border-left:4px solid var(--g7)}
  .esc .card > h3{padding-bottom:8px;border-bottom:1px solid var(--line)}
  .resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .resumo div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .resumo b{display:block;font:700 30px/1.1 "Barlow Condensed";color:var(--g9)}
  .resumo span{font-size:12px;color:var(--muted)}
  .blocos{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px 20px}
  .bloco{min-width:0}
  .pasta{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
  .pasta>summary{cursor:pointer;padding:14px 16px;font:600 20px "Barlow Condensed";list-style:none;display:flex;gap:10px;align-items:center}
  .pasta>summary::-webkit-details-marker{display:none}
  .pasta>summary::after{content:"▸";color:var(--muted);transition:transform .15s}
  .pasta[open]>summary::after{transform:rotate(90deg)}
  .pasta>summary small{font:500 13px Barlow;color:var(--muted);margin-left:auto}
  .pasta-corpo{padding:0 12px 12px}
  .grupo{font:600 13px Barlow;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 2px}
  .placar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
  .placar input{width:64px}
  .elenco{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
  .row small.sub{margin-left:6px}
  @media (max-width:560px){.esc{gap:12px}.resumo b{font-size:26px}}
</style>
</head>
<body>
<a class="skip" href="#app">Pular para o conteúdo</a>
<header class="top"><div class="wrap brand"><img class="logo" src="img/marca.svg" alt="" width="44" height="44">
  <div><div class="bname">TNT <span>ESPORTES</span></div><div class="bsub">Secretaria Municipal de Esportes · Tonantins/AM</div></div></div></header>
<main id="app" tabindex="-1" class="wrap esc"><div class="card empty">Carregando…</div></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/escola.js"></script>
</body>
</html>
