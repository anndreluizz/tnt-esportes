<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa do juiz · TNT Esportes</title>
<meta name="description" content="Página do juiz: lança o placar e os pênaltis dos jogos do campeonato interno da escola">
<meta name="theme-color" content="#0d2f73">
<meta name="robots" content="noindex">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  .mesa{max-width:680px;margin:18px auto 40px}
  .mesa .hero,.mesa .chips{margin-bottom:12px}
  .jcard{display:grid;gap:10px;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;margin-bottom:10px}
  .jcard:hover,.jcard:focus-visible{border-color:var(--tnt-neon)}
  .jvs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font:700 22px/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase}
  .jvs .jt{border-left:6px solid var(--tnt-eletrico);padding-left:8px}.jvs .jt.vermelho{border-color:#ff4d4d}.jvs .jt:last-child{text-align:right;border-left:0;border-right:6px solid var(--tnt-eletrico);padding:0 8px 0 0}.jvs .jt:last-child.vermelho{border-color:#ff4d4d}
  .jx{color:var(--muted)}.jfim{display:flex;justify-content:space-between;align-items:center;gap:8px}.jgo{color:var(--tnt-neon);font-weight:700}
  .mesa-jogo{display:grid;gap:14px;margin-top:10px}
  .mrelogio{display:grid;gap:6px;justify-items:center;text-align:center}
  .sumclock{font:800 84px/1 "Barlow Condensed",sans-serif;color:var(--tnt-neon);font-variant-numeric:tabular-nums}
  .mplacar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mlado{border:2px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:4px;justify-items:center;text-align:center}
  .mbar{width:40px;height:6px;border-radius:3px;background:var(--tnt-eletrico)}.mlado.vermelho .mbar{background:#ff4d4d}
  .mnome{font:700 20px/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase}.msub{font-size:12px;color:var(--muted)}
  .mpts{font:800 84px/1 "Barlow Condensed",sans-serif;color:var(--tnt-neon)}
  .mbtns{display:flex;gap:8px}.mbtns .sumbtn{min-height:52px}.mmenos{min-width:56px;font-size:26px}.mmais{flex:1;font-size:16px;background:var(--tnt-eletrico);border-color:var(--tnt-eletrico);color:#fff}.mlado.vermelho .mmais{background:#ff4d4d;border-color:#ff4d4d}
  .pen input{width:72px}
  .penbox{margin:0;display:grid;gap:6px}
  .penrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .penlado{min-width:120px;font-weight:600}
  .penc{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font-size:18px;cursor:pointer}
  .penc.g{border-color:var(--tnt-neon);background:rgba(0,230,118,.16)}
  .penc.x{border-color:#ff8794;background:rgba(255,135,148,.14)}
  .penres{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .mais{border:1px dashed var(--line);border-radius:12px;padding:10px 12px}.mais summary{cursor:pointer;font-weight:600;min-height:32px}
  .mlances{display:grid;gap:6px;margin:10px 0}
  .sumbtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .sumbtn{min-height:44px;padding:8px 12px;border-radius:12px;border:2px solid var(--tnt-neon);background:rgba(0,230,118,.14);color:var(--ink);font-weight:700;cursor:pointer}
  .sumbtn.ghost{border-color:var(--line);background:transparent}
  .sumlog{margin:0;padding-left:20px;font-size:14px;color:var(--muted);display:grid;gap:2px}
  @media (max-width:420px){.mpts,.sumclock{font-size:68px}}
  @media print{.top,.noprint,#toast{display:none!important}body{background:#fff!important;color:#000!important}.card{border:1px solid #000!important}}
</style>
</head>
<body class="escuro">
<a class="skip" href="#app">Pular para o conteúdo</a>
<header class="top"><div class="wrap brand"><img class="logo" src="img/marca.svg" alt="" width="44" height="44">
  <div><div class="bname">TNT <span>ESPORTES</span></div></div></div></header>
<main id="app" tabindex="-1" class="wrap mesa"><div class="card empty">Carregando…</div></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/juiz.js"></script>
</body>
</html>
